name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Test, version, package, and publish
    if: >-
      github.event.head_commit.message == 'new version' ||
      startsWith(github.event.head_commit.message, 'release: patch') ||
      startsWith(github.event.head_commit.message, 'release: minor') ||
      startsWith(github.event.head_commit.message, 'release: major')
    runs-on: windows-2025
    env:
      CGO_ENABLED: '1'
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Select release increment and calculate version
        id: version
        run: |
          if ($env:COMMIT_MESSAGE -eq 'new version') {
            $bump = 'patch'
          } elseif ($env:COMMIT_MESSAGE -match '^release: (patch|minor|major)(?:\s|$)') {
            $bump = $Matches[1]
          } else {
            throw "Unsupported release marker: $env:COMMIT_MESSAGE"
          }

          $tags = @(git tag --list 'v[0-9]*')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read Git tags.' }
          $versions = foreach ($tag in $tags) {
            # Historical four-part tags are accepted; new releases use three-part SemVer.
            if ($tag -match '^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.\d+)?$') {
              [pscustomobject]@{
                Major = [long]$Matches[1]
                Minor = [long]$Matches[2]
                Patch = [long]$Matches[3]
              }
            }
          }
          $latest = $versions | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
          if ($null -eq $latest) { $latest = [pscustomobject]@{ Major = 0L; Minor = 0L; Patch = 0L } }
          switch ($bump) {
            'major' { $major = $latest.Major + 1; $minor = 0; $patch = 0 }
            'minor' { $major = $latest.Major; $minor = $latest.Minor + 1; $patch = 0 }
            default { $major = $latest.Major; $minor = $latest.Minor; $patch = $latest.Patch + 1 }
          }
          $version = "$major.$minor.$patch"
          "value=$version" >> $env:GITHUB_OUTPUT
          "bump=$bump" >> $env:GITHUB_OUTPUT
          Write-Host "Next release: v$version ($bump)"

      - name: Prepare verified Everything dependencies
        run: ./scripts/prepare-ci-dependencies.ps1

      - name: Configure MinGW for cgo
        run: |
          $gccCandidates = @(
            'C:\mingw64\bin',
            'C:\msys64\mingw64\bin',
            'C:\msys64\ucrt64\bin'
          )
          $gccDirectory = $gccCandidates | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          if (-not $gccDirectory) { throw 'A MinGW-w64 gcc.exe compiler is required for cgo.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $gccDirectory
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:GITHUB_WORKSPACE

      - name: Test source
        run: |
          go version
          gcc --version
          go test ./...

      - name: Build release archive
        run: ./scripts/package.ps1 -Version '${{ steps.version.outputs.value }}' -SkipTests

      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "v$version"
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\NewWind-$version-windows-amd64.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release archive not found: $archive"
          }
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  $(Split-Path -Leaf $archive)" -Encoding ascii
          gh release create $tag $archive $checksum `
            --target $env:GITHUB_SHA `
            --title "NewWind $version" `
            --generate-notes
